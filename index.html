<main id="game">
<canvas id="farm" aria-label="Fazenda isométrica interativa. Escolha uma ferramenta e clique nos canteiros."></canvas>
<section id="expansion-banner" class="expansion-banner" hidden><small>LOJA · EXPANSÃO</small><strong id="expansion-dimensions"></strong><p>O terreno cresce pelas duas bordas da frente.</p><button id="exit-expansion">Voltar à fazenda</button></section>
<div class="expansion-controls" aria-label="Expansão do terreno">
<button class="expand-arrow" id="expand-left" hidden aria-label="Expandir pela borda da frente à esquerda"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 5h16v20h11L24 44 5 25h11Z"/></svg><b>EXPANDIR</b><small></small></button>
<button class="expand-arrow" id="expand-right" hidden aria-label="Expandir pela borda da frente à direita"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 5h16v20h11L24 44 5 25h11Z"/></svg><b>EXPANDIR</b><small></small></button>
</div><header class="game-header">
<div class="player-hud"><div class="experience"><div id="xp-fill"></div><span id="xp">0/100</span></div><div class="level"><svg aria-hidden="true"><use href="#i-star"/></svg><strong id="level">1</strong></div><button id="farm-name" class="farm-name" aria-label="Editar nome do jogador"><span class="name-bubble" aria-hidden="true">▤</span><span>Fazenda de <b id="player-name"></b></span></button></div>
<div class="wallets"><div id="gold-wallet" class="wallet gold-wallet" tabindex="0" data-hud-tip="MiniOuro" aria-label="MiniOuro"><svg aria-hidden="true"><use href="#i-coin"/></svg><strong id="money">50</strong></div><div id="cash-wallet" class="wallet cash-wallet" tabindex="0" data-hud-tip="MiniGrana" aria-label="MiniGrana"><svg aria-hidden="true"><use href="#i-cash"/></svg><strong id="cash">0</strong></div></div>
<div class="header-actions"><button id="mail" aria-label="Presentes recebidos"><svg aria-hidden="true"><use href="#i-mail"/></svg><span>0</span></button><div><button id="add-cash" class="add-cash"><span>Adicionar<br>MiniGrana</span><svg aria-hidden="true"><use href="#i-cash"/></svg></button><button id="passport" class="passport">Passaporte</button></div></div>
</header>
<div id="hud-tooltip" class="hud-tooltip" role="tooltip" hidden></div>
<div class="tooltip" id="tooltip" hidden></div>
<div class="toast" id="message" role="status" hidden></div>
<footer class="dock"><section class="seed-cards" aria-label="Sementes"><div class="section-label">SUAS SEMENTES</div><button class="seed active" data-crop="corn"><span class="crop-art corn-art"><i></i><i></i><i></i></span><b>Milho</b><small>5 moedas</small></button><button class="seed" data-crop="carrot"><span class="crop-art carrot-art"><i></i></span><b>Cenoura</b><small>8 moedas</small></button><button class="seed" data-crop="strawberry"><span class="crop-art berry-art"><i></i></span><b>Morango</b><small>12 moedas</small></button></section><div class="dock-divider"></div><nav class="tools" aria-label="Ferramentas"><button class="active" data-tool="plant" title="Plantar (2)"><svg><use href="#i-seed"/></svg><span>Plantar</span><kbd>2</kbd></button><button data-tool="water" title="Regar (3)"><svg><use href="#i-water"/></svg><span>Regar</span><kbd>3</kbd></button><button data-tool="harvest" title="Colher (4)"><svg><use href="#i-harvest"/></svg><span>Colher</span><kbd>4</kbd></button></nav></footer>

<nav class="farm-panel" aria-label="Painel da fazenda">
<button id="shop" class="panel-shop" title="Loja" aria-label="Loja"><svg aria-hidden="true"><use href="#i-market"/></svg><b>Loja</b></button>
<button data-tool="info" class="panel-view active" title="Visualizar (1)" aria-label="Modo de visualizar"><svg aria-hidden="true"><use href="#i-view"/></svg></button>
<button data-tool="till" class="panel-hoe" title="Enxada: aplicar terra (5)" aria-label="Enxada: aplicar terra"><svg aria-hidden="true"><use href="#i-hoe"/></svg></button>
<button id="machines" class="panel-machines" title="Máquinas e tratores" aria-label="Máquinas e tratores"><svg aria-hidden="true"><use href="#i-helmet"/></svg></button>
<button id="achievements" class="panel-achievements" title="Conquistas" aria-label="Conquistas"><svg aria-hidden="true"><use href="#i-chest"/></svg></button>
<button id="gifts" class="panel-gifts" title="Presentes dos amigos" aria-label="Presentes dos amigos"><svg aria-hidden="true"><use href="#i-gift"/></svg><span class="gift-count">0</span></button>
<button id="warehouse" class="panel-warehouse" title="Armazém" aria-label="Armazém"><svg aria-hidden="true"><use href="#i-warehouse"/></svg></button>
</nav>
<div class="camera"><button id="out" aria-label="Diminuir zoom">−</button><button id="home" aria-label="Centralizar fazenda">⌂</button><button id="in" aria-label="Aumentar zoom">+</button></div>

<dialog id="modal"><button id="close-modal" aria-label="Fechar">×</button><h2 id="modal-title"></h2><div id="modal-body"></div></dialog>
</main><script src="game.js?v=6"></script></body></html>
