<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha Minifazenda</title><style>
*{box-sizing:border-box}body{margin:0;background:#133d26;font-family:Trebuchet MS,Arial,sans-serif;color:#fff}main{position:relative;max-width:1400px;margin:auto;height:100dvh;min-height:540px;overflow:hidden;background:#399633}canvas{width:100%;height:100%;display:block}.top{position:absolute;top:12px;left:16px;right:16px;display:flex;gap:14px;align-items:center;pointer-events:none}.pill{border:3px solid #eac74b;border-radius:15px;background:#9cf1ee;color:#173d35;padding:8px 18px;font-weight:900;font-size:22px;box-shadow:0 4px #0b553b}.name{position:absolute;left:20px;top:72px;color:#fff36e;font-size:21px;font-weight:bold;text-shadow:2px 2px #333}.help{margin-left:auto;font-size:13px;background:#24c4e2}.bottom{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;padding:9px;gap:8px;border:3px solid #c39945;background:#fff0bc;border-radius:17px;box-shadow:0 5px #805629}button{cursor:pointer;font:700 14px Trebuchet MS,Arial;border:2px solid #cca858;border-radius:9px;background:#fff9da;padding:8px 13px;color:#38542b}button span{display:block;font-size:26px;margin-bottom:3px}button.active{background:#aee983;border-color:#4a8d37;box-shadow:inset 0 0 0 2px #ecffd5}button:hover{filter:brightness(1.08)}.toast{position:absolute;bottom:116px;left:50%;transform:translateX(-50%);background:#153e2de8;padding:11px 20px;border-radius:30px;text-align:center;font-size:14px;pointer-events:none;max-width:90%;width:max-content}.side{position:absolute;right:15px;bottom:22px;display:flex;gap:5px}.side button{padding:6px 12px;font-size:22px;background:#8edce7}.intro{position:absolute;left:20px;top:104px;font-size:13px;color:#e4f6c8;max-width:190px;line-height:1.5}@media(max-width:700px){.pill{font-size:16px;padding:7px}.top{gap:6px}.help{display:none}.bottom{gap:3px;bottom:12px;padding:6px}button{font-size:11px;padding:7px}button span{font-size:22px}.side{bottom:105px}.intro{max-width:140px;font-size:11px}.toast{bottom:107px;font-size:12px}}
</style><main><canvas id="farm" aria-label="Fazenda isométrica: escolha uma ferramenta e clique nos canteiros"></canvas><div class="top"><div class="pill" id="xp"></div><div class="pill" id="level"></div><div class="pill" id="money"></div><div class="pill help">MINHA MINIFAZENDA · versão inicial</div></div><div class="name">Fazenda da gente</div><div class="intro">Um pedacinho de terra para cuidar.<br>Plante, regue e veja crescer!</div><nav class="bottom" aria-label="Ferramentas"><button data-tool="plant"><span>🌱</span>Plantar · 5</button><button data-tool="water"><span>🚿</span>Regar</button><button data-tool="harvest"><span>🧺</span>Colher · +15</button><button data-tool="info"><span>👆</span>Examinar</button><button id="sound"><span>💾</span>Salvar</button></nav><div class="toast" id="message" role="status">Escolha um canteiro para plantar milho. Cada semente custa 5 moedas.</div><div class="side"><button id="out" aria-label="Diminuir zoom">−</button><button id="in" aria-label="Aumentar zoom">+</button></div></main><script src="game.js"></script></html>
