<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#277b30"><title>Minha Minifazenda</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>

<symbol id="i-harvest" viewBox="0 0 48 48"><path d="M13 24C9 0 40 0 35 24" fill="none" stroke="#865022" stroke-width="4"/><path d="m6 22 5 20h27l5-20Z" fill="#dba147" stroke="#805020" stroke-width="2"/><path d="M9 29h31M10 35h29M18 24v16m10-16v16" stroke="#f6ca74" stroke-width="2"/><path d="M13 20c-8-14 6-17 10-7 1-14 15-11 12 5" fill="#77aa37"/><ellipse cx="27" cy="18" rx="8" ry="6" fill="#efb83b"/></symbol>

<symbol id="i-shop" viewBox="0 0 48 48"><path d="M8 19h32v25H8Z" fill="#f2dda1" stroke="#806d35" stroke-width="2"/><path d="M4 19 10 5h28l6 14" fill="#df6d48"/><path d="m14 5-3 14m13-14v14M34 5l3 14" stroke="#fff0bd" stroke-width="7"/><path d="M3 19c0 8 9 8 10 0 1 8 10 8 11 0 1 8 10 8 11 0 1 8 10 8 10 0" fill="#e58b56"/><path d="M27 28h9v16h-9ZM13 28h9v9h-9Z" fill="#65bcc2" stroke="#a98a44" stroke-width="2"/></symbol>

</defs></svg>
<main id="game">
<canvas id="farm" aria-label="Fazenda isométrica interativa. Escolha uma ferramenta e clique nos canteiros."></canvas>
<section id="expansion-banner" class="expansion-banner" hidden><small>LOJA · EXPANSÃO</small><strong id="expansion-dimensions"></strong><p>O terreno cresce pelas duas bordas da frente.</p><button id="exit-expansion">Voltar à fazenda</button></section>
<div class="expansion-controls" aria-label="Expansão do terreno">
<button class="expand-arrow" id="expand-left" hidden aria-label="Expandir pela borda da frente à esquerda"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 5h16v20h11L24 44 5 25h11Z"/></svg><b>EXPANDIR</b><small></small></button>
<button class="expand-arrow" id="expand-right" hidden aria-label="Expandir pela borda da frente à direita"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 5h16v20h11L24 44 5 25h11Z"/></svg><b>EXPANDIR</b><small></small></button>
</div><header class="hud"><div class="experience"><span id="xp">0 / 100</span><div id="xp-fill"></div></div><div class="level"><svg><use href="#i-star"/></svg><strong id="level">1</strong></div><div class="balance"><svg><use href="#i-coin"/></svg><strong id="money">50</strong></div><button class="save" id="save" title="Salvar fazenda"><svg><use href="#i-save"/></svg><span>Salvar</span></button></header>
<div class="farm-title"><span>Fazenda</span><strong>Recanto do Sol</strong></div>
<section class="objective" aria-label="Objetivo atual"><small>SEU PRÓXIMO PASSO <span id="objective-progress"></span></small><b id="objective-title"></b><p id="objective-text"></p><button id="claim" disabled>Receber recompensa</button><span class="land-size" id="land-size"></span></section><div class="version">EM CONSTRUÇÃO <b>04</b></div>
<aside class="quests"><button id="quest" aria-label="Ver objetivo"><span class="quest-icon">!</span><b>Objetivos</b></button><button id="help" aria-label="Como jogar"><span class="help-icon">?</span><b>Ajuda</b></button></aside>
<div class="tooltip" id="tooltip" hidden></div>
<div class="toast" id="message" role="status">Sua história começa aqui: 50 moedas, 9 canteiros e a primeira semente.</div>
<footer class="dock"><section class="seed-cards" aria-label="Sementes"><div class="section-label">SUAS SEMENTES</div><button class="seed active" data-crop="corn"><span class="crop-art corn-art"><i></i><i></i><i></i></span><b>Milho</b><small>5 moedas</small></button><button class="seed" data-crop="carrot"><span class="crop-art carrot-art"><i></i></span><b>Cenoura</b><small>8 moedas</small></button><button class="seed" data-crop="strawberry"><span class="crop-art berry-art"><i></i></span><b>Morango</b><small>12 moedas</small></button></section><div class="dock-divider"></div><nav class="tools" aria-label="Ferramentas"><button data-tool="info" title="Examinar (1)"><svg><use href="#i-hand"/></svg><span>Examinar</span><kbd>1</kbd></button><button class="active" data-tool="plant" title="Plantar (2)"><svg><use href="#i-seed"/></svg><span>Plantar</span><kbd>2</kbd></button><button data-tool="water" title="Regar (3)"><svg><use href="#i-water"/></svg><span>Regar</span><kbd>3</kbd></button><button data-tool="harvest" title="Colher (4)"><svg><use href="#i-harvest"/></svg><span>Colher</span><kbd>4</kbd></button></nav><button class="shop" id="shop"><svg><use href="#i-shop"/></svg><b>LOJA</b></button></footer>
<div class="camera"><button id="out" aria-label="Diminuir zoom">−</button><button id="home" aria-label="Centralizar fazenda">⌂</button><button id="in" aria-label="Aumentar zoom">+</button></div>
<div class="hint">Arraste para passear pela fazenda · Role para aproximar</div>
<dialog id="modal"><button id="close-modal" aria-label="Fechar">×</button><h2 id="modal-title"></h2><div id="modal-body"></div></dialog>
</main><script src="game.js?v=4"></script></body></html>
